<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FamilyHub</title>

<style>
:root {
  --bg:#f1f3f8;
  --card:#ffffff;
  --primary:#6750A4; /* estilo Material You */
  --text:#1c1b1f;
  --text2:#6b6b75;
  --border:#ececf3;
}

/* ---------- BASE ---------- */
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family: system-ui, -apple-system, sans-serif;
  background:var(--bg);
  color:var(--text);
  max-width:480px;
  margin:auto;
}

/* ---------- HEADER ---------- */
.header{
  background:var(--primary);
  color:#fff;
  padding:40px 20px 20px;
  border-radius:0 0 24px 24px;
}
.header-title{
  font-size:28px;
  font-weight:800;
}
.header-date{
  opacity:0.8;
}

/* ---------- CALENDARIO ---------- */
.cal-grid-wrap{
  background:var(--card);
  border-radius:20px;
  padding:14px;
  margin:16px;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.cal-days-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}

.cday{
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  cursor:pointer;
  font-weight:600;
  transition:0.15s;
}

.cday:hover{background:#eee}
.cday:active{transform:scale(0.85)}

.cday.today{
  background:var(--primary);
  color:#fff;
}

.cday.selected{
  background:#e8def8;
  outline:2px solid var(--primary);
}

/* ---------- PANEL DÍA ---------- */
.day-panel{
  margin:16px;
  background:var(--card);
  border-radius:20px;
  padding:16px;
  display:none;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.day-panel.open{
  display:block;
  animation:fadeUp .25s ease;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}

/* ---------- EVENTOS ---------- */
.event{
  padding:12px;
  border-radius:12px;
  background:#f6f6fb;
  margin-bottom:8px;
  transition:.2s;
}

.event:hover{
  transform:scale(1.02);
}

/* ---------- BOTÓN ---------- */
.fab{
  position:fixed;
  bottom:20px;
  right:20px;
  width:56px;
  height:56px;
  border-radius:50%;
  background:var(--primary);
  color:#fff;
  font-size:28px;
  border:none;
}
</style>
</head>

<body>

<div class="header">
  <div class="header-title">FamilyHub</div>
  <div class="header-date" id="date"></div>
</div>

<div class="cal-grid-wrap">
  <div class="cal-days-grid" id="calendar"></div>
</div>

<div class="day-panel" id="dayPanel">
  <h3 id="dayTitle"></h3>
  <div id="dayEvents"></div>
</div>

<button class="fab">+</button>

<script>
let selectedDay=null;
let allEvents=[
  {date:"2025-09-17",desc:"Dentista"},
  {date:"2025-09-17",desc:"Fútbol niño"},
  {date:"2025-09-20",desc:"Compra"}
];

// ✅ CACHE PRO
let cache={};

function dateStr(d){
  return d.toISOString().split('T')[0];
}

// ✅ FIX + CACHE
function getEventsForDay(day){

  if(cache[day]) return cache[day];

  const result = allEvents.filter(e=>e.date===day);

  cache[day]=result;
  return result;
}

function renderCalendar(){
  const container=document.getElementById("calendar");
  container.innerHTML="";

  const today=new Date();
  const year=today.getFullYear();
  const month=today.getMonth();

  const days=new Date(year,month+1,0).getDate();

  for(let i=1;i<=days;i++){
    const d=new Date(year,month,i);
    const ds=dateStr(d);

    const div=document.createElement("div");
    div.className="cday";

    if(ds===dateStr(new Date())) div.classList.add("today");
    if(selectedDay===ds) div.classList.add("selected");

    div.textContent=i;
    div.onclick=()=>selectDay(ds);

    container.appendChild(div);
  }
}

function selectDay(day){
  selectedDay = selectedDay===day?null:day;

  renderCalendar();
  renderPanel();

  if(selectedDay){
    setTimeout(()=>{
      document.getElementById('dayPanel').scrollIntoView({behavior:'smooth'});
    },100);
  }
}

function renderPanel(){

  const panel=document.getElementById("dayPanel");

  if(!selectedDay){
    panel.classList.remove("open");
    return;
  }

  const events=getEventsForDay(selectedDay);

  document.getElementById("dayTitle").textContent=selectedDay;

  document.getElementById("dayEvents").innerHTML =
    events.length
      ? events.map(e=>`<div class="event">${e.desc}</div>`).join("")
      : "<p>Sin eventos</p>";

  panel.classList.add("open");
}

// FECHA
document.getElementById("date").textContent = new Date().toLocaleDateString();

// INIT
renderCalendar();
</script>

</body>
</html>
