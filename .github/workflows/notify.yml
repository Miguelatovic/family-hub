name: FamilyHub Notificación Diaria

on:
  schedule:
    # Cada día a las 7:00 hora de Madrid (UTC+2 en verano = 05:00 UTC)
    - cron: '0 5 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente para probar

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enviar notificación diaria
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
        run: node notify.js
